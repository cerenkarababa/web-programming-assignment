<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Contact - Ceren Travel Blog</title>
</head>

<body>

<header>
    <h1>Ceren Travel Blog</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>

    <h2>Contact Me</h2>

    <form>

        <fieldset>

            <legend>Travel Blog Contact Form</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <br><br>

            <label for="date">Travel Date:</label>
            <input type="date" id="date" name="date">

            <br><br>

            <label for="destination">Favorite Destination:</label>

            <select id="destination" name="destination">
                <option value="italy">Italy</option>
                <option value="spain">Spain</option>
                <option value="france">France</option>
                <option value="netherlands">Netherlands</option>
                <option value="japan">Japan</option>
                <option value="norway">Norway</option>
            </select>

            <br><br>

            <label for="message">Message:</label>
            <br>

            <textarea id="message" name="message" rows="5" cols="30"></textarea>

            <br><br>

            <input type="submit" value="Send Message">

        </fieldset>

    </form>

</main>

<footer>
    <p>Created by Ceren Karababa</p>
    <p>&copy; 2026 Ceren Travel Blog</p>
</footer>

</body>

</html>
